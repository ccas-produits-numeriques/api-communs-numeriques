name: Build Metabase Docker image

on:
  push:
    branches: [main]
    paths:
      - .infra/docker/metabase/Dockerfile
  workflow_dispatch:
  registry_package:
    types: [published]

concurrency:
  group: metabase-build-${{ github.event_name }}-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'registry_package' ||
      github.event.registry_package.name == 'sij_ca-certificates'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Metabase version from Dockerfile
        id: version
        run: |
          VERSION=$(sed -n 's/^FROM metabase\/metabase:\([^[:space:]]\+\)$/\1/p' .infra/docker/metabase/Dockerfile)

          if [ -z "$VERSION" ]; then
            echo "Could not extract Metabase version from .infra/docker/metabase/Dockerfile" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .infra/docker/metabase
          file: .infra/docker/metabase/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ccas-produits-numeriques/ccas_api-communs-numeriques_metabase:${{ steps.version.outputs.version }}
            ghcr.io/ccas-produits-numeriques/ccas_api-communs-numeriques_metabase:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ccas-produits-numeriques/api-communs-numeriques
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

  update_version_pr:
    if: >
      github.event_name != 'registry_package' ||
      github.event.registry_package.name == 'sij_ca-certificates'
    needs: build
    uses: "./.github/workflows/sync_metabase_version.yml"
    with:
      version: ${{ needs.build.outputs.version }}
