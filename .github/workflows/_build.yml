name: Build Docker Images
on:
  workflow_call:
    inputs:
      environment:
        description: The environment to build the image for
        type: string
        required: true
      skip:
        description: Skip the build
        type: boolean
        required: false
    secrets:
      SLACK_WEBHOOK_NOTIF:
        description: Slack webhook URL
        required: true
      OPENPGP_PRIVATE_SUBKEY:
        description: Github Actions' OpenPGP private subkey
        required: true
      SHARED_BIN_TOKEN:
        description: Authentication token for accessing private repositories
        required: true

jobs:
  npm-packages-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v4
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .

  build:
    if: ${{ success() }}
    needs: ["npm-packages-check"]
    concurrency:
      group: "build-${{ github.workflow }}-${{ github.ref }}"
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.SHARED_BIN_TOKEN }}
          submodules: recursive

      - name: Initialize the GnuPG keyring
        run: |
          echo -n "$OPENPGP_KEY" | gpg --import
        env:
          OPENPGP_KEY: ${{ secrets.OPENPGP_PRIVATE_SUBKEY }}

      - name: Setup SOPS
        uses: nhedger/setup-sops@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64
          install: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Set short git commit SHA
        run: |
          export COMMIT_ID=${{ github.sha }}
          echo "VERSION=${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: bump and release
        run: .bin/product app:build "${{ env.VERSION }}" push "${{ inputs.environment }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_NOTIF }}

      - name: Create sentry release
        run: .bin/product sentry:release "${{ env.VERSION }}"
