name: PR title lint + labels

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PR title + set labels
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

        with:
          script: |
            const { validatePrTitle } = await import('${{ github.workspace }}/.github/workflows/scripts/validate_pr_title.mjs');
            await validatePrTitle({ github, context, core, pr_title: process.env.PR_TITLE });
