name: Build docker images
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: "Commit SHA to build (overrides github.sha)"
        type: string
        required: false
      flow:
        description: "Calling flow"
        type: string
        required: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - name: Set sha version output
        id: get-version
        run: |
          export COMMIT_ID=${{ inputs.sha || github.sha }}
          echo "VERSION=sha-${COMMIT_ID::7}" >> $GITHUB_OUTPUT

  build_and_push:
    needs: version
    concurrency:
      group: "build-${{ github.workflow }}-${{ github.ref }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SHARED_BIN_TOKEN }}
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: .bin/product build:image "${{ needs.version.outputs.VERSION }}" push recette preproduction

  move_staging_tag:
    needs: [build_and_push]
    if: inputs.flow != 'hotfix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.SHARED_BIN_TOKEN }}

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v6
        name: Install Node.js
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release cli
        run: .bin/product release:post:build "${{ github.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELEASE_APP_PRIVATE_KEY_B64: ${{ secrets.GH_RELEASE_APP_PRIVATE_KEY_B64 }}
