name: CI

on:
  workflow_call:

jobs:
  npm-packages-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Clone mna-npm-check repository
        uses: actions/checkout@v4
        with:
          repository: mission-apprentissage/mna-npm-check
          path: mna-npm-check

      - name: Analyze NPM dependancies
        run: mna-npm-check/npm-check.sh -p .
  tests:
    if: ${{ success() }}
    needs: [npm-packages-check]
    timeout-minutes: 10
    name: "Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Make sure to use same dependencies version across all packages
        run: pnpm dedupe --check

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: start mongodb service
        run: |
          docker compose up --build -d --wait mongodb
          pnpm setup:mongodb

      - name: test
        run: pnpm test:ci --maxWorkers=3

      - name: prettier
        run: pnpm prettier:check
