spec:
  inputs:
    pipeline_action:
      description: "Action to run from GitLab UI"
      options:
        - deploy
        - rollback
      default: deploy
    rollback_env_type:
      description: "Rollback target environment type"
      options:
        - recette
        - preproduction
      default: recette
    rollback_ref:
      description: "Optional git ref (branch/tag/sha) to rollback. Empty = pipeline selected ref."
      default: ""
---
include:
  - .gitlab/deploy-template.yml
  - .gitlab/build-deploy-image.yml

workflow:
  name: "Déploiement API Communs Numériques"
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "rollback" && "$[[ inputs.rollback_env_type ]]" =~ /^(recette|preproduction)$/'
    - if: '$CI_COMMIT_TAG =~ /^(rc-\d+|latest-build|hotfix-\d+)$/'
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  ANSIBLE_REMOTE_USER: "deploy"
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SSL_NO_VERIFY: "true"

stages:
  - build
  - pre_deploy
  - deploy
  - post_deploy

.manual_deploy_template:
  stage: deploy
  interruptible: true # we can interrupt waiting
  allow_failure: false
  when: manual

update_cache:
  extends: .update_cache_template
  needs:
    - job: build_deploy_image
      optional: true

deploy_preproduction_gate:
  stage: deploy
  interruptible: true
  allow_failure: false
  resource_group: preproduction
  trigger:
    include: .gitlab/deploy-preproduction.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_TAG =~ /^rc-\d+$/'

deploy_recette_gate:
  stage: deploy
  interruptible: true
  allow_failure: false
  resource_group: recette
  trigger:
    include: .gitlab/deploy-recette.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_TAG == "latest-build"'

deploy_hotfix_preproduction_gate:
  stage: deploy
  interruptible: true
  allow_failure: false
  when: manual
  resource_group: preproduction
  trigger:
    include: .gitlab/deploy-preproduction.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_TAG =~ /^hotfix-\d+$/'

rollback_preproduction_gate:
  extends: .manual_deploy_template
  resource_group: preproduction
  trigger:
    include: .gitlab/deploy-preproduction.yml
    strategy: depend
  variables:
    RELEASE_ACTION: "rollback"
    TARGET_COMMIT_REF: "$[[ inputs.rollback_ref ]]"
    TARGET_COMMIT_SHA: "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "rollback" && "$[[ inputs.rollback_env_type ]]" == "preproduction"'

rollback_recette_gate:
  extends: .manual_deploy_template
  resource_group: recette
  trigger:
    include: .gitlab/deploy-recette.yml
    strategy: depend
  variables:
    RELEASE_ACTION: "rollback"
    TARGET_COMMIT_REF: "$[[ inputs.rollback_ref ]]"
    TARGET_COMMIT_SHA: "$CI_COMMIT_SHA"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.pipeline_action ]]" == "rollback" && "$[[ inputs.rollback_env_type ]]" == "recette"'
